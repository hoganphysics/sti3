name: Conda package

run-name: Conda ${{ inputs.build_type }} package from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: CMake build type used for the package
        required: true
        default: Release
        type: choice
        options:
          - Release
          - RelWithDebInfo

permissions:
  contents: read

concurrency:
  group: conda-package-${{ github.ref }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  build-package:
    name: ${{ matrix.name }} (${{ inputs.build_type }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            subdir: linux-64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            subdir: linux-aarch64
          - name: Windows
            # The Conda recipe targets the VS2022/v143 compiler toolchain.
            runner: windows-2022
            subdir: win-64

    env:
      STI3_CONDA_BUILD_TYPE: ${{ inputs.build_type }}
      STI3_GIT_COMMIT: ${{ github.sha }}
      STI3_GIT_DIRTY: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Conda packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/conda-pkgs
          key: conda-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environment-package.yml', 'conda/meta.yaml', 'conda/conda_build_config.yaml') }}
          restore-keys: |
            conda-packages-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Add Miniconda to PATH on Linux
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: echo "${CONDA}/bin" >> "${GITHUB_PATH}"

      # The GitHub-hosted ARM64 image does not include Miniconda. Install a
      # native Miniforge distribution before creating the package environment.
      - name: Set up Miniforge on Linux ARM64
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: 26.5.3-0
          activate-environment: ""
          conda-remove-defaults: "true"

      - name: Add Miniconda to PATH on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:CONDA\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:CONDA\Library\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Keep the conda-build driver separate from the recipe's native build
      # environment. In particular, this avoids activating MSVC once through
      # environment-dev.yml and then again inside conda-build on Windows.
      - name: Create package environment
        env:
          CONDA_PKGS_DIRS: ${{ runner.temp }}/conda-pkgs
        run: conda env create --file environment-package.yml

      - name: Create package output directory
        run: cmake -E make_directory "${{ runner.temp }}/sti3-conda-output"

      - name: Build Conda package
        env:
          CONDA_BLD_PATH: ${{ runner.temp }}/sti3-conda-build
          CONDA_PKGS_DIRS: ${{ runner.temp }}/conda-pkgs
        run: >-
          conda run --no-capture-output -n sti3-package
          conda-build --no-anaconda-upload --package-format .conda
          --output-folder "${{ runner.temp }}/sti3-conda-output"
          -c conda-forge conda

      - name: Upload Conda package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stipy-${{ matrix.subdir }}-${{ inputs.build_type }}
          path: ${{ runner.temp }}/sti3-conda-output/${{ matrix.subdir }}/*.conda
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
