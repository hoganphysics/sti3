# Example Server configuration file

Device Name = Frame2
IP Address = sr-magis 
Module = 2
Target Server = root

EnableActivate = true
EnableDeactivate = true

[NetworkHub]

NameService = 192.168.88.252:2809     # address:port of omniORB NameService
SelfRebind = true
SelfRebindIntervalSeconds = 30
EnablePrune = true
PruneScope = OwnIncomingSubtree
PruneIntervalSeconds = 300
PruneFailureThreshold = 3
PruneSuspectSeconds = 600

[omniORB]

traceLevel = 0                       # omniORB trace level
endPoint = giop:tcp:192.168.88.252:2811
endPointPublish = giop:tcp:192.168.88.252:2811
clientConnectTimeOutPeriod = 200
clientCallTimeOutPeriod    = 3000
scanGranularity            = 1

[EngineManager]

PlayReady Timeout ms = 2000
Trigger Timeout ms = 2000
PlayComplete Grace ms = 2000

# Devices send PlayComplete only after all measurement data is collected, which can take
# longer than the last event time (e.g., camera image readout and encoding). After the
# PlayComplete grace expires, the server keeps waiting -- up to Max Measurement Grace --
# as long as the pending devices are verifiably still Playing, re-checking every
# Measurement Poll interval. Max Measurement Grace ms = 0 disables the extension.
Max Measurement Grace ms = 60000
Measurement Poll ms = 1000

[EventScheduler]

Sequence Mode = Normal


[Metadata]

test = 123
color = blue


[Shot Repository]   # where shots are stored

Path = .sti/server1
