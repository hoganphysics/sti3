# Example Server configuration file

Device Name = Frame2
IP Address = sr-magis 
Module = 2
Target Server = root

EnableActivate = true
EnableDeactivate = true

[NetworkHub]

NameService = 192.168.1.109:2809     # address:port of omniORB NameService

[omniORB]

traceLevel = 10                       # omniORB trace level
endPointPublish = giop:tcp:192.168.1.109:
clientConnectTimeOutPeriod = 200
clientCallTimeOutPeriod    = 3000
scanGranularity            = 1

[Shot Repository]   # where shots are stored

Path = .sti/server1

