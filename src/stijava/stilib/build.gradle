plugins {
    // Apply the java-library plugin to add support for Java Library
    id 'java-library'
}

group = 'edu.stanford'
version = '0.0.1'
sourceCompatibility = '17'

repositories {
    // Use jcenter for resolving dependencies.
    // You can declare any Maven/Ivy/file repository here.
    jcenter()
}

dependencies {
    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'org.apache.commons:commons-math3:3.6.1'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:29.0-jre'

    // Use JUnit test framework
    testImplementation 'junit:junit:4.13'
}

def stiLibDir = "" + projectDir + "/../../../lib/"
println "dir: " + stiLibDir

//Add STI3 shared libraries to jar
task copyNativeBinaries(type: Copy) {
    from files(stiLibDir + "libstijava.so", 
               stiLibDir + "libstijava.so.3.0.0", 
               stiLibDir + "libstidevice.so", 
               stiLibDir + "libstidevice.so.3.0.0",
               stiLibDir + "libstinetwork.so",
               stiLibDir + "libstinetwork.so.3.0.0"
               ) // path native binaries
    into file('build/resources/main/lib/')    // Target resources directory
}

jar.dependsOn(copyNativeBinaries)

jar {
    manifest {
        attributes('Implementation-Title': project.name,
                   'Implementation-Version': project.version)
    }
}


task copyJar(type: Copy) {
    from jar // here it automatically reads jar file produced from jar task
    into '../../../lib/'
}

build.dependsOn copyJar

java {
    withJavadocJar()
}