plugins {
    // Apply the java plugin to add support for Java
    id 'java'

    // Apply the application plugin to add support for building a CLI application.
    id 'application'
}

repositories {
    // Use jcenter for resolving dependencies.
    // You can declare any Maven/Ivy/file repository here.
    jcenter()
}

dependencies {
    // This dependency is used by the application.
    implementation 'com.google.guava:guava:29.0-jre'

    // Use JUnit test framework
    testImplementation 'junit:junit:4.13'

    //Either of these work:

 //   implementation files('../../../lib/sti-0.0.1.jar')
    implementation fileTree(dir: '../../../lib', include: 'sti-*.jar')
}

//println "test gradle"

def BUILD_DIR=project.buildDir

application {
    // Define the main class for the application.
    mainClassName = 'edu.stanford.testdevice.TestDeviceApplication'
    applicationDefaultJvmArgs = ["-Djava.library.path=${BUILD_DIR}/libs/"]      //location of libstijava.so
}

// by default, implementation cannot be referenced, 
// this allows us to use it below
project.configurations.implementation.setCanBeResolved(true)



jar {
    manifest {
        attributes(
            'Main-Class': 'edu.stanford.testdevice.TestDeviceApplication',
//            "Class-Path": configurations.implementation.collect { it.name }.join(' ') 
            'Class-Path': 'sti-0.0.1.jar'
        )
    }



    // from {
    //     configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    // }
}